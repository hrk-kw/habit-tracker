<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f24">
<meta name="color-scheme" content="dark">
<title>習慣トラッカー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <button class="back-btn" id="back-btn" aria-label="戻る">←</button>
  <h1 class="app-title" id="app-title">習慣トラッカー</h1>
</header>

<main>
  <section class="screen" id="screen-home">
    <div class="card-list" id="card-list"></div>
  </section>

  <section class="screen" id="screen-gym">
    <div class="exercise-list" id="gym-exercise-list"></div>
    <button class="save-btn" id="gym-save-btn">ジムを記録して保存</button>
  </section>

  <section class="screen" id="screen-bike">
    <div class="bike-form" id="bike-form">
      <div class="toggle-group">
        <button class="toggle-btn" data-mode="outdoor">実走</button>
        <button class="toggle-btn" data-mode="gym_machine">ジムの固定バイク</button>
      </div>
      <label class="field-label">時間(分・任意)
        <input type="number" id="bike-duration" min="0" inputmode="numeric">
      </label>
      <label class="field-label">メモ(任意)
        <input type="text" id="bike-note">
      </label>
    </div>
    <button class="save-btn" id="bike-save-btn">自転車を記録して保存</button>
  </section>

  <section class="screen" id="screen-hometrack">
    <div class="checklist" id="hometrack-checklist"></div>
    <button class="save-btn" id="hometrack-save-btn">家トレを記録して保存</button>
  </section>
</main>

<div class="modal-overlay" id="edit-modal-overlay">
  <div class="modal">
    <h2 id="edit-modal-title">編集</h2>
    <label class="field-label">重量(kg)
      <input type="number" id="edit-weight" min="0" step="0.5" inputmode="decimal">
    </label>
    <label class="field-label">回数
      <input type="number" id="edit-reps" min="0" inputmode="numeric">
    </label>
    <div class="modal-actions">
      <button class="modal-btn modal-btn--danger" id="edit-remove-btn">セットを1つ減らす</button>
      <button class="modal-btn modal-btn--primary" id="edit-ok-btn">OK</button>
    </div>
    <button class="modal-btn modal-btn--cancel" id="edit-cancel-btn">キャンセル</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
